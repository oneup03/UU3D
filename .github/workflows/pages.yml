name: Pages

# Publishes README.md as https://oneup03.github.io/UU3D/.
#
# Uses Actions as the Pages source rather than the classic "build from a branch"
# setting, for one hard reason: that path runs Jekyll over a checkout WITH
# submodules, and dependencies/submodules/UESDK is private, so the build fails
# with no access. Here the checkout takes no submodules and Jekyll only ever
# sees a staging directory holding the README - it never walks src/, cmake/ or
# dependencies/ at all.
on:
  push:
    branches: [flat3d-afw]
    paths:
      - README.md
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it land and queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Jekyll turns index.md into the site root. Staging it rather than
      # pointing Jekyll at the repo keeps the build to two files.
      #
      # The Pages-only presentation tweaks happen HERE rather than in README.md
      # on purpose: the theme renders its own title banner, and kramdown's {:toc}
      # is not GitHub-flavoured markdown. Doing either in the README itself would
      # give a duplicated heading and a stray "{:toc}" line on the repo page.
      - name: Stage the site
        run: |
          mkdir -p site

          # Explicit front matter on both pages. The github-pages gem enables
          # jekyll-optional-front-matter, so a bare .md would render anyway, but
          # relying on that means a page silently ships as raw markdown if the
          # plugin set ever changes. Front matter also sets the banner heading,
          # which Cayman takes from page.title.
          #
          # Both drop their leading H1 for the same reason: the theme already
          # prints the title as the header banner, so keeping it renders twice.

          # --- index (the README) ---
          cat > site/body.md <<'FRONTMATTER'
          ---
          title: Unreal Universal 3D
          ---
          FRONTMATTER
          tail -n +2 README.md >> site/body.md

          # Contents list plus a link across to the changelog, inserted ahead of
          # the first section. 400+ lines and ~14 sections is past the point
          # where a reader can scan it.
          awk '
            BEGIN { inserted = 0 }
            /^## / && !inserted {
              print "[**Changelog**](changelog/) - what changed in each nightly."
              print ""
              print "## Contents"
              print "{:.no_toc}"
              print ""
              print "* TOC"
              print "{:toc}"
              print ""
              inserted = 1
            }
            { print }
          ' site/body.md > site/index.md
          rm site/body.md

          # --- changelog ---
          # permalink is set explicitly so the link above stays correct
          # regardless of the site's permalink style.
          cat > site/changelog.md <<'FRONTMATTER'
          ---
          title: Changelog
          description: What changed in each UU3D nightly
          permalink: /changelog/
          ---

          [&larr; Back to the README](../)

          FRONTMATTER
          tail -n +2 CHANGELOG.md >> site/changelog.md

          cat > site/_config.yml <<'CONFIG'
          title: Unreal Universal 3D
          description: Stereo 3D output for Unreal Engine games - no headset, no SteamVR or OpenXR
          theme: jekyll-theme-cayman
          # Cayman gates its header button on is_project_page. Set explicitly:
          # the metadata plugin that would normally infer this is not populated
          # when Jekyll runs against a staging directory rather than the repo.
          github:
            is_project_page: true
            repository_url: https://github.com/oneup03/UU3D
          CONFIG

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
